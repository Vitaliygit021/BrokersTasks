spring:
  application:
    name: Config

  cloud:
    config:
      server:
        git:
          uri: https://github.com/Vitaliygit021/BrokersTasks.git
          clone-on-start: true
          default-label: feature/Brokers
          search-paths: config-repo
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

server:
  port: 8888